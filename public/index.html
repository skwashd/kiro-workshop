<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit Lock</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    color: #e0e0ff;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
  }
  h1 {
    margin-top: 16px;
    font-size: 28px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #7df9ff;
    text-shadow: 0 0 20px rgba(125,249,255,0.5);
  }
  #game-container {
    position: relative;
    margin-top: 12px;
  }
  canvas {
    display: block;
    border: 1px solid #1a1a3a;
    border-radius: 8px;
  }
  #ui-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #ui-overlay.active { pointer-events: auto; }
  .overlay-panel {
    background: rgba(10, 10, 30, 0.92);
    border: 1px solid #3a3a6a;
    border-radius: 12px;
    padding: 28px 36px;
    text-align: center;
    max-width: 360px;
  }
  .overlay-panel h2 {
    font-size: 22px;
    color: #7df9ff;
    margin-bottom: 12px;
    letter-spacing: 3px;
  }
  .overlay-panel p {
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 8px;
    color: #b0b0d0;
  }
  .stat { color: #ffcc66; font-size: 18px; margin: 6px 0; }
  .btn {
    display: inline-block;
    margin-top: 14px;
    padding: 10px 28px;
    background: transparent;
    border: 2px solid #7df9ff;
    border-radius: 6px;
    color: #7df9ff;
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .btn:hover, .btn:focus { background: #7df9ff; color: #0a0a1a; outline: none; }
  #name-input {
    display: block;
    width: 200px;
    margin: 10px auto 0;
    padding: 8px 12px;
    background: #111130;
    border: 1px solid #3a3a6a;
    border-radius: 4px;
    color: #e0e0ff;
    font-family: inherit;
    font-size: 15px;
    text-align: center;
  }
  #name-input:focus { border-color: #7df9ff; outline: none; }
  .error-msg { color: #ff6666; font-size: 13px; margin-top: 6px; min-height: 18px; }
  #scoreboard {
    margin-top: 16px;
    margin-bottom: 24px;
    width: 460px;
    max-width: 95vw;
  }
  #scoreboard h3 {
    text-align: center;
    color: #7df9ff;
    letter-spacing: 3px;
    margin-bottom: 8px;
    font-size: 16px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    padding: 6px 10px;
    text-align: left;
    font-size: 13px;
    border-bottom: 1px solid #1a1a3a;
  }
  th { color: #7df9ff; font-weight: normal; letter-spacing: 1px; }
  td { color: #b0b0d0; }
  td:nth-child(2), th:nth-child(2) { text-align: right; }
  td:nth-child(3), th:nth-child(3) { text-align: right; }
  .instructions { font-size: 12px; color: #666690; margin-top: 4px; }
</style>
</head>
<body>
<h1>Orbit Lock</h1>

<div id="game-container">
  <canvas id="game" width="500" height="500"></canvas>
  <div id="ui-overlay" class="active">
    <div id="start-panel" class="overlay-panel">
      <h2>Orbit Lock</h2>
      <p>Break through rotating rings by timing your pulse to hit the gap.</p>
      <p>Each ring spins faster. Precision earns bonus points.</p>
      <p class="instructions">Press <strong>SPACE</strong> or <strong>TAP</strong> to fire</p>
      <button class="btn" id="start-btn">Begin</button>
    </div>
    <div id="end-panel" class="overlay-panel" style="display:none">
      <h2>Signal Lost</h2>
      <p class="stat">Score: <span id="final-score">0</span></p>
      <p class="stat">Rings Cleared: <span id="final-rings">0</span></p>
      <p>Enter your name for the leaderboard:</p>
      <input type="text" id="name-input" maxlength="20" placeholder="Your name" autocomplete="off">
      <div class="error-msg" id="submit-error"></div>
      <div>
        <button class="btn" id="submit-btn">Save Score</button>
        <button class="btn" id="skip-btn">Skip</button>
      </div>
    </div>
  </div>
</div>

<div id="scoreboard">
  <h3>High Scores</h3>
  <table>
    <thead><tr><th>Name</th><th>Score</th><th>Rings</th></tr></thead>
    <tbody id="score-body"><tr><td colspan="3" style="text-align:center;color:#444">Loading...</td></tr></tbody>
  </table>
</div>

<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const CX = W / 2, CY = H / 2;

  const overlay = document.getElementById('ui-overlay');
  const startPanel = document.getElementById('start-panel');
  const endPanel = document.getElementById('end-panel');
  const startBtn = document.getElementById('start-btn');
  const submitBtn = document.getElementById('submit-btn');
  const skipBtn = document.getElementById('skip-btn');
  const nameInput = document.getElementById('name-input');
  const submitError = document.getElementById('submit-error');
  const finalScoreEl = document.getElementById('final-score');
  const finalRingsEl = document.getElementById('final-rings');
  const scoreBody = document.getElementById('score-body');

  const RING_COLORS = ['#7df9ff','#ff6eb4','#ffcc66','#66ff99','#cc99ff','#ff8844','#44ddff','#ff4466','#88ff44','#ddaaff'];
  const BASE_RADIUS = 50;
  const RING_SPACING = 28;
  const GAP_ANGLE = Math.PI * 0.28;
  const BEAM_SPEED = 4.5;
  const BASE_RING_SPEED = 0.6;
  const SPEED_INCREMENT = 0.12;
  const TOTAL_RINGS = 12;
  const PULSE_RADIUS = 6;

  let state = 'menu';
  let rings = [];
  let currentRing = 0;
  let score = 0;
  let beamAngle = 0;
  let beamExtent = 0;
  let pulseActive = false;
  let pulseAngle = 0;
  let pulseR = 0;
  let pulseSpeed = 0;
  let hitEffect = null;
  let failEffect = null;
  let particles = [];
  let frameId = null;
  let submitting = false;

  function initRings() {
    rings = [];
    for (let i = 0; i < TOTAL_RINGS; i++) {
      const radius = BASE_RADIUS + (i + 1) * RING_SPACING;
      const speed = (BASE_RING_SPEED + i * SPEED_INCREMENT) * (i % 2 === 0 ? 1 : -1);
      const gapStart = Math.random() * Math.PI * 2;
      rings.push({ radius, speed, gapStart, angle: gapStart, cleared: false, color: RING_COLORS[i % RING_COLORS.length] });
    }
  }

  function startGame() {
    state = 'playing';
    score = 0;
    currentRing = 0;
    beamAngle = -Math.PI / 2;
    beamExtent = BASE_RADIUS;
    pulseActive = false;
    hitEffect = null;
    failEffect = null;
    particles = [];
    submitting = false;
    initRings();
    overlay.classList.remove('active');
    startPanel.style.display = 'none';
    endPanel.style.display = 'none';
    submitError.textContent = '';
  }

  function endGame() {
    state = 'ended';
    finalScoreEl.textContent = score;
    finalRingsEl.textContent = currentRing;
    overlay.classList.add('active');
    startPanel.style.display = 'none';
    endPanel.style.display = '';
    nameInput.value = '';
    submitError.textContent = '';
    nameInput.focus();
    loadScores();
  }

  function showMenu() {
    state = 'menu';
    overlay.classList.add('active');
    startPanel.style.display = '';
    endPanel.style.display = 'none';
  }

  function firePulse() {
    if (pulseActive || state !== 'playing') return;
    pulseActive = true;
    pulseAngle = beamAngle;
    pulseR = BASE_RADIUS;
    pulseSpeed = BEAM_SPEED;
  }

  function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 3;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 30 + Math.random() * 20,
        maxLife: 50,
        color,
        size: 2 + Math.random() * 3
      });
    }
  }

  function normalizeAngle(a) {
    a = a % (Math.PI * 2);
    if (a < 0) a += Math.PI * 2;
    return a;
  }

  function angleDiff(a, b) {
    let d = normalizeAngle(a) - normalizeAngle(b);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  }

  function update() {
    if (state !== 'playing' && state !== 'ended') return;

    if (state === 'playing') {
      beamAngle += 0.02;

      for (let i = 0; i < rings.length; i++) {
        if (!rings[i].cleared) {
          rings[i].angle += rings[i].speed * 0.016;
        }
      }

      if (pulseActive) {
        pulseR += pulseSpeed;
        const ring = rings[currentRing];
        if (ring && pulseR >= ring.radius - 4) {
          const gapCenter = normalizeAngle(ring.angle);
          const diff = Math.abs(angleDiff(pulseAngle, gapCenter));
          const halfGap = GAP_ANGLE / 2;

          if (diff < halfGap) {
            const precision = 1 - (diff / halfGap);
            const ringValue = (currentRing + 1) * 100;
            const precisionBonus = Math.round(precision * ringValue);
            score += ringValue + precisionBonus;
            ring.cleared = true;
            beamExtent = ring.radius + RING_SPACING / 2;
            const px = CX + Math.cos(pulseAngle) * ring.radius;
            const py = CY + Math.sin(pulseAngle) * ring.radius;
            spawnParticles(px, py, ring.color, 20);
            hitEffect = { ring: currentRing, timer: 15, color: ring.color };
            currentRing++;
            pulseActive = false;

            if (currentRing >= TOTAL_RINGS) {
              score += 5000;
              setTimeout(endGame, 600);
            }
          } else {
            const px = CX + Math.cos(pulseAngle) * ring.radius;
            const py = CY + Math.sin(pulseAngle) * ring.radius;
            spawnParticles(px, py, '#ff4444', 15);
            failEffect = { timer: 20 };
            pulseActive = false;
            setTimeout(endGame, 400);
          }
        }

        const maxR = currentRing < rings.length ? rings[currentRing].radius + 20 : W;
        if (pulseR > maxR) {
          pulseActive = false;
        }
      }

      if (hitEffect) {
        hitEffect.timer--;
        if (hitEffect.timer <= 0) hitEffect = null;
      }
      if (failEffect) {
        failEffect.timer--;
        if (failEffect.timer <= 0) failEffect = null;
      }
    }

    particles = particles.filter(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.life--;
      return p.life > 0;
    });
  }

  function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    for (let i = 0; i < 60; i++) {
      const sx = Math.random() * W;
      const sy = Math.random() * H;
      const brightness = 0.1 + Math.random() * 0.3;
      ctx.fillStyle = `rgba(200,200,255,${brightness})`;
      ctx.fillRect(sx, sy, 1, 1);
    }
    ctx.restore();

    for (let i = rings.length - 1; i >= 0; i--) {
      const ring = rings[i];
      if (ring.cleared) {
        ctx.strokeStyle = `rgba(${hexToRgb(ring.color)},0.15)`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(CX, CY, ring.radius, 0, Math.PI * 2);
        ctx.stroke();
        continue;
      }
      const gapCenter = normalizeAngle(ring.angle);
      const gapStart = gapCenter - GAP_ANGLE / 2;
      const gapEnd = gapCenter + GAP_ANGLE / 2;

      const isNext = i === currentRing;
      ctx.lineWidth = isNext ? 4 : 2.5;
      const alpha = isNext ? 0.9 : 0.5;
      ctx.strokeStyle = `rgba(${hexToRgb(ring.color)},${alpha})`;

      ctx.beginPath();
      ctx.arc(CX, CY, ring.radius, gapEnd, gapStart + Math.PI * 2);
      ctx.stroke();

      if (isNext) {
        ctx.strokeStyle = `rgba(${hexToRgb(ring.color)},0.2)`;
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.arc(CX, CY, ring.radius, gapEnd, gapStart + Math.PI * 2);
        ctx.stroke();
      }
    }

    const coreGlow = ctx.createRadialGradient(CX, CY, 5, CX, CY, BASE_RADIUS);
    coreGlow.addColorStop(0, 'rgba(125,249,255,0.3)');
    coreGlow.addColorStop(1, 'rgba(125,249,255,0)');
    ctx.fillStyle = coreGlow;
    ctx.beginPath();
    ctx.arc(CX, CY, BASE_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#7df9ff';
    ctx.beginPath();
    ctx.arc(CX, CY, 6, 0, Math.PI * 2);
    ctx.fill();

    if (state === 'playing') {
      const bx = CX + Math.cos(beamAngle) * beamExtent;
      const by = CY + Math.sin(beamAngle) * beamExtent;
      const grad = ctx.createLinearGradient(CX, CY, bx, by);
      grad.addColorStop(0, 'rgba(125,249,255,0.6)');
      grad.addColorStop(1, 'rgba(125,249,255,0.1)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.lineTo(bx, by);
      ctx.stroke();

      const dotX = CX + Math.cos(beamAngle) * (beamExtent - 8);
      const dotY = CY + Math.sin(beamAngle) * (beamExtent - 8);
      ctx.fillStyle = '#7df9ff';
      ctx.beginPath();
      ctx.arc(dotX, dotY, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    if (pulseActive) {
      const px = CX + Math.cos(pulseAngle) * pulseR;
      const py = CY + Math.sin(pulseAngle) * pulseR;
      ctx.shadowColor = '#7df9ff';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(px, py, PULSE_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    if (hitEffect) {
      const alpha = hitEffect.timer / 15;
      ctx.strokeStyle = `rgba(${hexToRgb(hitEffect.color)},${alpha * 0.5})`;
      ctx.lineWidth = 3;
      const r = rings[hitEffect.ring].radius;
      ctx.beginPath();
      ctx.arc(CX, CY, r + (15 - hitEffect.timer) * 2, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (failEffect) {
      const alpha = failEffect.timer / 20;
      ctx.fillStyle = `rgba(255,50,50,${alpha * 0.15})`;
      ctx.fillRect(0, 0, W, H);
    }

    for (const p of particles) {
      const alpha = p.life / p.maxLife;
      ctx.fillStyle = `rgba(${hexToRgb(p.color)},${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
      ctx.fill();
    }

    if (state === 'playing') {
      ctx.fillStyle = '#7df9ff';
      ctx.font = '16px Courier New';
      ctx.textAlign = 'left';
      ctx.fillText('SCORE: ' + score, 14, 28);
      ctx.fillStyle = '#ffcc66';
      ctx.fillText('RING: ' + (currentRing + 1) + '/' + TOTAL_RINGS, 14, 48);
    }
  }

  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `${r},${g},${b}`;
  }

  function gameLoop() {
    update();
    draw();
    frameId = requestAnimationFrame(gameLoop);
  }

  function handleAction(e) {
    if (state === 'playing') {
      if (e.type === 'keydown' && e.code === 'Space') {
        e.preventDefault();
        firePulse();
      } else if (e.type === 'pointerdown') {
        const tag = e.target.tagName;
        if (tag !== 'BUTTON' && tag !== 'INPUT') {
          firePulse();
        }
      }
    }
  }

  document.addEventListener('keydown', handleAction);
  canvas.addEventListener('pointerdown', handleAction);

  startBtn.addEventListener('click', () => {
    startGame();
  });

  skipBtn.addEventListener('click', () => {
    showMenu();
  });

  submitBtn.addEventListener('click', () => {
    submitScore();
  });

  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      submitScore();
    }
    e.stopPropagation();
  });

  nameInput.addEventListener('keyup', (e) => { e.stopPropagation(); });
  nameInput.addEventListener('keypress', (e) => { e.stopPropagation(); });

  async function submitScore() {
    if (submitting) return;
    const name = nameInput.value.trim();
    if (!name) {
      submitError.textContent = 'Please enter a name.';
      return;
    }
    if (name.length > 20) {
      submitError.textContent = 'Name must be 20 characters or fewer.';
      return;
    }

    submitting = true;
    submitBtn.disabled = true;
    submitError.textContent = '';

    try {
      const res = await fetch('api/scores', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, score, rings_cleared: currentRing })
      });
      if (!res.ok) {
        const data = await res.json();
        throw new Error(data.error || 'Failed to save score.');
      }
      await loadScores();
      showMenu();
    } catch (err) {
      submitError.textContent = err.message;
      submitting = false;
      submitBtn.disabled = false;
    }
  }

  async function loadScores() {
    try {
      const res = await fetch('api/scores');
      const data = await res.json();
      if (data.length === 0) {
        scoreBody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#444">No scores yet</td></tr>';
        return;
      }
      scoreBody.innerHTML = data.map((s, i) =>
        `<tr><td>${escapeHtml(s.name)}</td><td>${s.score}</td><td>${s.rings_cleared}</td></tr>`
      ).join('');
    } catch (e) {
      scoreBody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#ff4444">Error loading scores</td></tr>';
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  initRings();
  draw();
  gameLoop();
  loadScores();
})();
</script>
</body>
</html>
