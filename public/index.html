<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0a12;color:#e0e0e8;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow-x:hidden}
  h1{font-size:2.4rem;letter-spacing:.6rem;margin:1.2rem 0 .2rem;color:#7df9ff;text-shadow:0 0 20px rgba(125,249,255,.4)}
  .subtitle{font-size:.85rem;color:#6a6a80;margin-bottom:1rem}
  canvas{display:block;border-radius:50%;box-shadow:0 0 40px rgba(125,249,255,.12)}
  .hud{display:flex;gap:2rem;margin:.8rem 0;font-size:1.1rem}
  .hud span{color:#7df9ff}
  #message{height:1.6rem;font-size:1rem;color:#ff6b6b;margin:.4rem 0;text-align:center}
  #score-form{display:none;flex-direction:column;align-items:center;gap:.6rem;margin:.6rem 0}
  #score-form input{background:#14142a;border:1px solid #3a3a5c;color:#e0e0e8;padding:.4rem .8rem;font-family:inherit;font-size:1rem;border-radius:4px;width:14rem;text-align:center}
  #score-form input:focus{outline:none;border-color:#7df9ff;box-shadow:0 0 8px rgba(125,249,255,.3)}
  #score-form button,#restart-btn{background:#1a1a3e;border:1px solid #7df9ff;color:#7df9ff;padding:.4rem 1.4rem;font-family:inherit;font-size:.95rem;border-radius:4px;cursor:pointer;transition:background .2s}
  #score-form button:hover,#restart-btn:hover{background:#2a2a5e}
  #score-form button:disabled{opacity:.4;cursor:default}
  #restart-btn{display:none;margin:.4rem 0}
  #scoreboard{margin:1rem 0 2rem;width:min(90vw,26rem)}
  #scoreboard h2{font-size:1.1rem;color:#7df9ff;margin-bottom:.5rem;text-align:center}
  #scoreboard table{width:100%;border-collapse:collapse}
  #scoreboard th{font-size:.75rem;color:#6a6a80;text-align:left;padding:.25rem .4rem;border-bottom:1px solid #2a2a3c}
  #scoreboard td{font-size:.85rem;padding:.25rem .4rem;border-bottom:1px solid #16162a}
  #scoreboard td:nth-child(1){color:#6a6a80;width:2rem}
  #scoreboard td:nth-child(2){color:#c0c0d0}
  #scoreboard td:nth-child(3){color:#7df9ff;text-align:right;font-weight:bold}
  .controls-hint{font-size:.75rem;color:#4a4a60;margin:.4rem 0}
  #save-error{color:#ff6b6b;font-size:.85rem;min-height:1.2rem}
</style>
</head>
<body>
<h1>PULSE</h1>
<p class="subtitle">time the beat &middot; hit the ring</p>
<canvas id="game" width="400" height="400"></canvas>
<div class="hud">
  <div>Score: <span id="hud-score">0</span></div>
  <div>Streak: <span id="hud-streak">0</span></div>
  <div>Lives: <span id="hud-lives">3</span></div>
</div>
<div id="message"></div>
<p class="controls-hint">Click, tap, or press Space to pulse</p>
<div id="score-form">
  <p>Save your score:</p>
  <input type="text" id="name-input" maxlength="20" placeholder="Your name" autocomplete="off">
  <button id="save-btn">Save</button>
  <div id="save-error"></div>
</div>
<button id="restart-btn">Play Again</button>
<div id="scoreboard">
  <h2>High Scores</h2>
  <table><thead><tr><th>#</th><th>Name</th><th>Score</th></tr></thead><tbody id="score-body"></tbody></table>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height, CX = W/2, CY = H/2;

  const hudScore = document.getElementById('hud-score');
  const hudStreak = document.getElementById('hud-streak');
  const hudLives = document.getElementById('hud-lives');
  const messageEl = document.getElementById('message');
  const scoreForm = document.getElementById('score-form');
  const nameInput = document.getElementById('name-input');
  const saveBtn = document.getElementById('save-btn');
  const saveError = document.getElementById('save-error');
  const restartBtn = document.getElementById('restart-btn');
  const scoreBody = document.getElementById('score-body');

  const MAX_RADIUS = 170;
  const TARGET_RING_WIDTH = 6;
  const PULSE_SPEED_BASE = 120;
  const LIVES_TOTAL = 3;

  let state, score, streak, lives, pulseRadius, pulseGrowing, pulseSpeed;
  let targets, lastTime, animId;
  let targetSpawnTimer, targetLifespan, roundTargets, difficulty;
  let saving = false;

  function init() {
    state = 'playing';
    score = 0; streak = 0; lives = LIVES_TOTAL;
    pulseRadius = 0; pulseGrowing = true;
    pulseSpeed = PULSE_SPEED_BASE;
    targets = []; targetSpawnTimer = 0; roundTargets = 0; difficulty = 1;
    targetLifespan = 3.0;
    lastTime = performance.now();
    saving = false;

    hudScore.textContent = '0';
    hudStreak.textContent = '0';
    hudLives.textContent = String(LIVES_TOTAL);
    messageEl.textContent = '';
    scoreForm.style.display = 'none';
    restartBtn.style.display = 'none';
    saveBtn.disabled = false;
    saveError.textContent = '';

    spawnTarget();
    loop(performance.now());
  }

  function spawnTarget() {
    const minR = 40, maxR = MAX_RADIUS - 10;
    const r = minR + Math.random() * (maxR - minR);
    const hue = (Math.random() * 360)|0;
    targets.push({ radius: r, age: 0, maxAge: targetLifespan, hue, hit: false, fadeOut: 0 });
    roundTargets++;
  }

  function update(dt) {
    if (state !== 'playing') return;

    if (pulseGrowing) {
      pulseRadius += pulseSpeed * dt;
      if (pulseRadius >= MAX_RADIUS) { pulseRadius = MAX_RADIUS; pulseGrowing = false; }
    } else {
      pulseRadius -= pulseSpeed * dt;
      if (pulseRadius <= 0) { pulseRadius = 0; pulseGrowing = true; }
    }

    for (let i = targets.length - 1; i >= 0; i--) {
      const t = targets[i];
      if (t.hit) {
        t.fadeOut -= dt;
        if (t.fadeOut <= 0) targets.splice(i, 1);
        continue;
      }
      t.age += dt;
      if (t.age >= t.maxAge) {
        lives--;
        streak = 0;
        hudLives.textContent = String(lives);
        hudStreak.textContent = '0';
        targets.splice(i, 1);
        if (lives <= 0) { endGame(); return; }
        flashMessage('Miss!', '#ff6b6b');
      }
    }

    targetSpawnTimer += dt;
    const spawnInterval = Math.max(0.8, 2.0 - difficulty * 0.12);
    if (targetSpawnTimer >= spawnInterval && targets.filter(t=>!t.hit).length < 3 + Math.floor(difficulty/3)) {
      targetSpawnTimer = 0;
      spawnTarget();
    }

    if (roundTargets % 8 === 0 && roundTargets > 0) {
      difficulty = Math.min(15, 1 + Math.floor(roundTargets / 8));
      pulseSpeed = PULSE_SPEED_BASE + difficulty * 8;
      targetLifespan = Math.max(1.4, 3.0 - difficulty * 0.1);
    }
  }

  function tryHit() {
    if (state !== 'playing') return;
    let bestIdx = -1, bestDist = Infinity;
    for (let i = 0; i < targets.length; i++) {
      if (targets[i].hit) continue;
      const d = Math.abs(pulseRadius - targets[i].radius);
      if (d < bestDist) { bestDist = d; bestIdx = i; }
    }

    if (bestIdx === -1) return;

    const tolerance = 28 - Math.min(difficulty, 10);
    if (bestDist <= tolerance) {
      const t = targets[bestIdx];
      t.hit = true;
      t.fadeOut = 0.3;

      const accuracy = 1 - (bestDist / tolerance);
      let pts = Math.round(10 + 90 * accuracy * accuracy);
      streak++;
      if (streak >= 5) pts = Math.round(pts * 1.5);
      else if (streak >= 3) pts = Math.round(pts * 1.2);

      score += pts;
      hudScore.textContent = String(score);
      hudStreak.textContent = String(streak);

      const label = accuracy > 0.9 ? 'Perfect!' : accuracy > 0.6 ? 'Great!' : 'OK';
      const color = accuracy > 0.9 ? '#7df9ff' : accuracy > 0.6 ? '#a0f0a0' : '#d0d070';
      flashMessage(`${label} +${pts}`, color);
    } else {
      lives--;
      streak = 0;
      hudLives.textContent = String(lives);
      hudStreak.textContent = '0';
      if (lives <= 0) { endGame(); return; }
      flashMessage('Miss!', '#ff6b6b');
    }
  }

  let msgTimer = 0;
  function flashMessage(txt, color) {
    messageEl.textContent = txt;
    messageEl.style.color = color;
    msgTimer = 1.0;
  }

  function endGame() {
    state = 'ended';
    messageEl.textContent = `Game Over — Score: ${score}`;
    messageEl.style.color = '#ff6b6b';
    scoreForm.style.display = 'flex';
    restartBtn.style.display = 'inline-block';
    nameInput.focus();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    ctx.fillStyle = '#0a0a12';
    ctx.beginPath(); ctx.arc(CX, CY, MAX_RADIUS + 15, 0, Math.PI*2); ctx.fill();

    for (let r = 40; r <= MAX_RADIUS; r += 40) {
      ctx.strokeStyle = 'rgba(60,60,100,0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI*2); ctx.stroke();
    }

    for (const t of targets) {
      let alpha = t.hit ? t.fadeOut / 0.3 : Math.max(0, 1 - t.age / t.maxAge);
      const urgency = t.hit ? 0 : t.age / t.maxAge;
      const glow = t.hit ? 20 : 4 + urgency * 12;
      ctx.strokeStyle = `hsla(${t.hue},80%,${60 + urgency*20}%,${alpha})`;
      ctx.lineWidth = TARGET_RING_WIDTH;
      ctx.shadowColor = `hsla(${t.hue},90%,60%,${alpha*0.6})`;
      ctx.shadowBlur = glow;
      ctx.beginPath(); ctx.arc(CX, CY, t.radius, 0, Math.PI*2); ctx.stroke();
      ctx.shadowBlur = 0;

      if (!t.hit) {
        const remaining = 1 - t.age / t.maxAge;
        const arcLen = Math.PI * 2 * remaining;
        const startAngle = -Math.PI/2;
        ctx.strokeStyle = `hsla(${t.hue},90%,75%,${alpha*0.4})`;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(CX, CY, t.radius + 6, startAngle, startAngle + arcLen); ctx.stroke();
      }
    }

    const pulseAlpha = 0.7 + 0.3 * Math.sin(performance.now() / 200);
    ctx.strokeStyle = `rgba(125,249,255,${pulseAlpha})`;
    ctx.lineWidth = 3;
    ctx.shadowColor = 'rgba(125,249,255,0.5)';
    ctx.shadowBlur = 15;
    ctx.beginPath(); ctx.arc(CX, CY, Math.max(1, pulseRadius), 0, Math.PI*2); ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#7df9ff';
    ctx.beginPath(); ctx.arc(CX, CY, 4, 0, Math.PI*2); ctx.fill();
  }

  function loop(ts) {
    const dt = Math.min((ts - lastTime) / 1000, 0.1);
    lastTime = ts;

    if (msgTimer > 0) {
      msgTimer -= dt;
      if (msgTimer <= 0) messageEl.textContent = '';
    }

    update(dt);
    draw();
    animId = requestAnimationFrame(loop);
  }

  canvas.addEventListener('click', tryHit);
  canvas.addEventListener('touchstart', function(e){ e.preventDefault(); tryHit(); }, {passive:false});
  document.addEventListener('keydown', function(e){
    if (e.code === 'Space' && state === 'playing' &&
        document.activeElement !== nameInput) {
      e.preventDefault();
      tryHit();
    }
  });

  saveBtn.addEventListener('click', saveScore);
  nameInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') { e.preventDefault(); saveScore(); }
  });

  async function saveScore() {
    if (saving) return;
    const name = nameInput.value.trim();
    if (!name) { saveError.textContent = 'Please enter a name.'; return; }
    if (name.length > 20) { saveError.textContent = 'Name must be 20 characters or fewer.'; return; }

    saving = true;
    saveBtn.disabled = true;
    saveError.textContent = '';

    try {
      const res = await fetch('api/scores', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ name, score })
      });
      if (!res.ok) {
        const data = await res.json().catch(()=>null);
        throw new Error((data && data.error) || `Server error (${res.status})`);
      }
      scoreForm.style.display = 'none';
      await loadScores();
    } catch(err) {
      saveError.textContent = err.message;
      saving = false;
      saveBtn.disabled = false;
    }
  }

  restartBtn.addEventListener('click', function(){
    cancelAnimationFrame(animId);
    init();
  });

  async function loadScores() {
    try {
      const res = await fetch('api/scores');
      const rows = await res.json();
      scoreBody.innerHTML = '';
      rows.forEach(function(r, i){
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${i+1}</td><td>${esc(r.name)}</td><td>${r.score}</td>`;
        scoreBody.appendChild(tr);
      });
    } catch(e) { /* silent */ }
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  loadScores();
  init();
})();
</script>
</body>
</html>
